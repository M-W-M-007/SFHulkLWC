<template>
    <lightning-card title="Component A" icon-name="standard:custom">
        <!-- Send message to B -->
        <div class="slds-m-around_medium">
            <lightning-input 
                label="Enter message for Component B" 
                placeholder="Type here...">
            </lightning-input>
            <lightning-button 
                label="Send to B" 
                onclick={handleButtonClick}>
            </lightning-button>
        </div>

        <!-- Display received message from B -->
        <div class="slds-m-around_medium">
            <p>Latest message from B: <strong>{receivedMessageFromB}</strong></p>
        </div>
    </lightning-card>
</template>
