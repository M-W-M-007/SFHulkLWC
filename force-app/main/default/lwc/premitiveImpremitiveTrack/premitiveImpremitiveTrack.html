<template>
    <lightning-card  variant="Narrow"  title="Student Register Form" icon-name="standard:account">
        <div class="slds-p-around_medium lgc-bg">
            <lightning-input type="text" label="First Name" onkeyup={handleFirstName}></lightning-input>
            <lightning-input type="text" label="Last Name" onkeyup={handleLastName}></lightning-input>
            <lightning-input type="email" label="Email" onkeyup={handleEmail}></lightning-input>
        </div>
    </lightning-card>

    <lightning-card  variant="Narrow"  title="Student Register Form 1" icon-name="standard:contact">
        <div class="slds-p-around_medium lgc-bg">
            <p>First Name: {firstName}</p>
            <p>Last Name: {lastName}</p>
            <p>Email: {email}</p>
        </div>
        </lightning-card>

    <lightning-card  variant="Narrow"  title="Student Register Form 2" icon-name="standard:contact">
        <div class="slds-p-around_medium lgc-bg">
            <p>Student First Name: {studentData.firstName}</p>
            <p>Student Last Name: {studentData.lastName}</p>
            <p>Student Email: {studentData.email}</p>
        </div>
        </lightning-card>

        <lightning-card  variant="Narrow"  title="Student Register Form 3" icon-name="standard:contact">
        <div class="slds-p-around_medium lgc-bg">
            <p>Recieved Student First Name: {recievedStudentData.firstName}</p>
            <p>Recieved Student Last Name: {recievedStudentData.lastName}</p>
            <p>Recieved Student Email: {recievedStudentData.email}</p>
        </div>
        </lightning-card>
</template>
