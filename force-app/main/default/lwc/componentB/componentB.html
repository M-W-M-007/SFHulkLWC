<template>
    <lightning-card title="Component B" icon-name="standard:custom">
        <!-- Send message to A -->
        <div class="slds-m-around_medium">
            <lightning-input 
                label="Enter message for Component A" 
                placeholder="Type here...">
            </lightning-input>
            <lightning-button 
                label="Send to A" 
                onclick={handleButtonClick}>
            </lightning-button>
            <lightning-button 
                label="Send to C" 
                onclick={handleButtonClickC}>
            </lightning-button>
        </div>

        <!-- Display received message from A -->
        <div class="slds-m-around_medium">
            <p>Latest message from A: <strong>{receivedMessageFromA}</strong></p>
        </div>
    </lightning-card>
</template>
